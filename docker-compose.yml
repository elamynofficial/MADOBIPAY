services:
  postgres:
    image: postgres:16-alpine
    container_name: madobipay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: madobipay
      POSTGRES_PASSWORD: madobipay
      POSTGRES_DB: madobipay
    ports:
      - "5432:5432"
    volumes:
      - madobipay_pg:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  madobipay_pg:
